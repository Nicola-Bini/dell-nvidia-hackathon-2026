          description: "A crisp, easy-drinking Pilsner beer that is influenced by the great brewing regions of the world, but that charts its own course through this elegant style. 4.9% 16oz can" }
      - { id: mi_narragansett_lager, name: "Narragansett Lager", price_cents: 575,
          description: "Narragansett Lager is old reliable. It was the first beer brewed by “The Original Six” back in 1890, and the best selling beer in New England from the 1930’s to the 1970’s. It has crossed paths with Dr. Seuss, it was famously crushed by Captain Quint in Jaws, and it was the first alcoholic beverage to partner with a professional sports team – the Boston Red Sox from 1944-1975. Drinking a Lager is drinking to New England history. Hi Neighbor! Have a ‘Gansett!" }
      - { id: mi_hero_95_low_carb, name: "Hero 95 (low carb)", price_cents: 700,
          description: "Hero95 is a crisp and refreshing 95 calorie lager. It’s for beer drinkers who live with a purpose and care about the choices they make. For the People who make big and small sacrifices every day for the benefit of others and themselves. It’s for sharing with friends and enjoying the satisfying moments in life that make everything worth it. Because there’s a hero in all of us. 4% CAN 12oz" }
      - { ref: mi_fat_tire }
      - { id: mi_voodoo_ranger_hard_charged_tea, name: "Voodoo Ranger Hard Charged Tea", price_cents: 750,
          description: "Hang on to your teabags, this 7% lemon-favored hard tea is the hardest tea on the shelf. CAN 12oz" }
      - { id: mi_moat_mountain_brewing_miss_vs_blueberry_ale, name: "Moat Mountain Brewing Miss V's Blueberry Ale", price_cents: 850,
          description: "0ur Naturally Flavored American Ale. We use 90 lbs. of Wild Maine Blueberries in every brew with our original process of adding the steam-extracted juices post fermentation. Our intent has always been; beer first, fruit second. The results showcase a remarkable crisp, light beer with a mild fruit flavor. 4.9% 16ozCAN" }
      - { id: mi_sullivans_malting_red_ale, name: "Sullivan's Malting Red Ale", price_cents: 1100,
          description: "A classic ruby ale with deep malt combining rich biscuit and gentle caramel notes. 5% 16oz CAN" }
      - { id: mi_kona_big_wave, name: "Kona Big Wave", price_cents: 700,
          description: "Kona Brewing Co. was founded by father and son team Cameron Healy and Spoon Khalsa. The pair had a vision to reflect the spirit, culture, and beauty of Hawaii in a collection of local island beers, so in 1994 they set out for the Big Island to bring their dream to life. Kona Big Wave, originally brewed as Pacific Golden Ale was brewed in 1994 and inspired by the legendary waves in Hawaii. Now, Kona Big Wave has rebranded from Kona Brewing Co. and is debuting a new logo and modernized packaging design, while staying true to the DNA of Big Wave. Kona Big Wave’s easy-drinking, island-inspired taste has become an iconic go-to beer all around the world. It’s time to grab your friends, bring the good vibes, and pass around a couple of ice-cold Kona Big Waves. 5.3% 16oz CAN" }
      - { id: mi_widowmaker_riff_city_lager, name: "Widowmaker Riff City Lager", price_cents: 950,
          description: "Brewed with a single malt imported from Germany and steeped noble hops. Biscuit-like aroma, mildly sweet yet crisp, with a subtle bitter bite culminating in an elevated yet simply delicious offering. Welcome to Riff City. 4.20% 16oz CAN" }
      - { id: mi_naragansett_dels_shandy, name: "Naragansett Dels Shandy", price_cents: 575,
          description: "Narragansett’s Famous Lager has been brewed & beloved throughout New England for over 120 years. The first Del’s stand opened in RI in 1948 using an old family recipe brought over from Italy. Since then, both ‘Gansett and Del’s Lemonade have refreshed thousands of happy customers on and around the Rhode Island beaches…and beyond. Now the two flavors are combined to create a most refreshing summertime adult beverage. We hope you love it!" }
      - { id: mi_naragansett_fresh_catch, name: "Naragansett Fresh Catch", price_cents: 750 }
