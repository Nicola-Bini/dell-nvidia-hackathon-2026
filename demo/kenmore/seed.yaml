      - { id: mi_dreaming_tree_chardonnay, name: "Dreaming Tree Chardonnay", price_cents: 1050,
          description: "Dreaming tree captures the essence of Central Coast wines. It is a big wine that is wonderfully drinkable solo or with food. It is fruity--and exceptionally well-balanced. Nice after taste--sort of a lingering spicy/citrus feel. Listed prices: $10.50 / $36." }
      - { id: mi_lab_rose, name: "Lab Rose", price_cents: 850,
          description: "Lab is a very versatile, fresh and light wine, made with traditional grape varieties of this region. Fruity with great acidity. Listed prices: $8.50 / $30." }
      - { id: mi_misguided_vines_aurora_catarratto, name: "Misguided Vines Aurora Catarratto", price_cents: 1000,
          description: "Catarratto (aka Lucido) has a lively, crisp, and zesty acidity that makes you think of Sicilian lemon trees basking in the sun. It is a native Sicilian grape, planted throughout the island. Aurora is a great example of how versatile and unique this grape can be." }
  - id: sec_red_wine
    name: "Red Wine"
    items:
      - { id: mi_meiomi_pinot_noir, name: "Meiomi Pinot Noir", price_cents: 1000,
          description: "Discover the well balanced, richly flavored, and deliciously complex taste of Meiomi Pinot Noir. Lifted aromas of jammy fruit and toasty oak are followed by expressive dark berry, juicy strawberry, and toasty mocha flavors. Listed prices: $10 / $36." }
      - { id: mi_dreaming_tree_crush, name: "Dreaming Tree Crush", price_cents: 1000,
          description: "Crush is a special blend hand-selected from our favorite varieties. This wine pulls you in with notes of smoky berry and a pop of raspberry jam. Around the table or out on the patio, it's a wine you're going to want to share with your favorite people. Listed prices: $10 / $36." }
      - { id: mi_leese_fitch_cabernet, name: "Leese-Fitch Cabernet", price_cents: 1000,
          description: "A rich and bold expression with aromas of blackberry, toasted spice and tobacco leaf. The inviting aromas ring true on the juicy palate with loads of blackberry and boysenberry fruit flavors and layers of jam, allspice and sweet oak adding depth and richness. Listed prices: $10 / $36." }
      - { id: mi_leese_fitch_merlot, name: "Leese-Fitch Merlot", price_cents: 1000,
          description: "A bright and inviting with aromas of ripe red fruits; raspberry, cherry and pomegranate. Additional aromas of red currants, clove spice and sweet vanilla lead to a medium-bodied, juicy palate. Layers of juicy fruit flavors, black olive and notes of dried lavender add complexity. Listed prices: $10 / $36." }
