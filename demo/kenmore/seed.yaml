      - { id: mi_citizen_unified_press, name: "Citizen Unified Press", price_cents: 1050,
          description: "Dry hard apple cider 5.2% 16oz CAN" }
      - { id: mi_downeast_original_blend, name: "Downeast Original Blend", price_cents: 950,
          description: "Juicy and sweet, tastes and smells just like farm fresh cider you drank as a kid. Intensely flavorful." }
      - { id: mi_stormalong_red_skies_at_night, name: "Stormalong Red Skies At Night", price_cents: 850, available: false,
          description: "A tropical, fruit forward cider made with passionfruit and hibiscus. It has a rich finish and deep pink color. flavor 5.5% **temporarily unavailable**" }
      - { id: mi_happy_dad_grape, name: "Happy Dad Grape", price_cents: 750,
          description: "Happy Dad Grape Hard Seltzer is a true game-changer refreshment for those see king a crisp, delightful, gluten-free seltzer experience. Unlike other seltzers, it boasts a gentle level of carbonation, and its all-natural flavors ensure a pure and unadulterated taste that leaves no lingering aftertaste. All-natural Grape offering a light and invigorating sensation with every sip. 5% 12oz CAN" }
      - { id: mi_happy_dad_fruit_punch, name: "Happy Dad Fruit Punch", price_cents: 750,
          description: "Happy Dad Fruit Punch Hard Seltzer is a true game-changer refreshment for those seeking a crisp, delightful, gluten-free seltzer experience. Unlike other seltzers, it boasts a gentle level of carbonation, and its all-natural flavors ensure a pure and unadulterated taste that leaves no lingering aftertaste. Fruit Punch stands out as the crowd-pleaser among our flavors, offering a light and invigorating sensation with every sip. 5% 12oz CAN" }
      - { id: mi_sunboy_pineapple, name: "Sunboy Pineapple", price_cents: 950,
