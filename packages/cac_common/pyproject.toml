[project]
name = "cac-common"
version = "0.1.0"
description = "Shared Python for CAC: settings, search text, embedding, publish"
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cac_common"]

[tool.ruff]
line-length = 100
