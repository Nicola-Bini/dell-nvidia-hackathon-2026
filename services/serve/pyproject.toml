[project]
name = "cac-serve"
version = "0.1.0"
description = "CAC Serve API (docs/SCHEMA.md 8.5): port 8080, database role cac_serve"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cac-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = [
  "httpx2>=2.13.1",
  "pytest>=8.3",
  "pyyaml>=6.0",
  "ruff>=0.6",
]

[tool.uv.sources]
cac-common = { path = "../../packages/cac_common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cac_serve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from source, not through the editable-install .pth files: macOS can flag a venv
# under ~/Desktop as hidden, and Python 3.12.13 skips hidden .pth files.
pythonpath = ["src", "../../packages/cac_common"]
markers = ["intents: the 30 fixture intents through the whole pipeline (needs fake_llm or the box model)"]

[tool.ruff]
line-length = 100
